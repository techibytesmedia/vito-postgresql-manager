name: Publish v0.1.2

on:
  push:
    tags: ['v0.1.2']

permissions:
  contents: read

concurrency:
  group: release-v0.1.2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the verified tag as the latest normal release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          tag = os.environ['GITHUB_REF_NAME']
          repository = os.environ['GITHUB_REPOSITORY']
          manifest = json.loads(Path('release.json').read_text())
          assert tag == 'v0.1.2' == 'v' + manifest['version']
          assert repository == manifest['owner'] + '/' + manifest['repository']
          notes = Path('.github/release-notes/v0.1.2.md').read_text()
          base = 'https://api.github.com/repos/' + repository

          def api(path, data=None):
              request = urllib.request.Request(
                  base + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'User-Agent': 'vito-postgresql-manager-release',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          ref = api('/git/ref/tags/' + tag)
          assert ref['object']['type'] == 'commit'
          assert ref['object']['sha'] == os.environ['GITHUB_SHA']
          try:
              release = api('/releases/tags/' + tag)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              release = api('/releases', {
                  'tag_name': tag,
                  'target_commitish': os.environ['GITHUB_SHA'],
                  'name': 'Vito PostgreSQL Manager ' + tag,
                  'body': notes,
                  'draft': False,
                  'prerelease': False,
                  'make_latest': 'true',
              })
          assert release['tag_name'] == tag
          assert not release['draft'] and not release['prerelease']
          latest = api('/releases/latest')
          assert latest['id'] == release['id']
          print(release['html_url'])
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
              '[Published ' + tag + '](' + release['html_url'] + ')\n'
          )
          PY
