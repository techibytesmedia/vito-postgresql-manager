name: Checks
on: [push, pull_request]
jobs:
  verify:
    name: Vito ${{ matrix.vito }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vito: '4.1.0'
            commit: c72f3d039cdc707e69b9659e30fa7727547a1175
          - vito: '4.1.1'
            commit: b65680dedceaa77c9f1d13ad2a8d2e67d8d2f692
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, intl, ftp, zip, pcntl, posix, bcmath
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: find Actions Console Jobs Models Services Support database -name '*.php' -exec php -l {} \; && php -l Plugin.php
      - run: |
          mkdir -p .work
          curl -fsSL https://codeload.github.com/vitodeploy/vito/zip/${{ matrix.commit }} -o .work/vito.zip
          unzip -q .work/vito.zip -d .work
          cd .work/vito-${{ matrix.commit }}
          composer install --no-dev --no-interaction --prefer-dist --no-scripts
      - run: |
          python tools/test_archive.py dist/development
          php tests/host.php .work/vito-${{ matrix.commit }} dist/development.zip
      - name: Recover a rejected 0.1.1 installation
        if: matrix.vito == '4.1.0'
        run: |
          curl -fsSL https://codeload.github.com/techibytesmedia/vito-postgresql-manager/zip/1c371f2202a43810966db71a5a5011d7937471fa -o .work/v0.1.1.zip
          php tests/recovery.php .work/vito-${{ matrix.commit }} .work/v0.1.1.zip 011012000410 rejected
          php tests/recovery.php .work/vito-${{ matrix.commit }} dist/development.zip 011012000410 recovered
